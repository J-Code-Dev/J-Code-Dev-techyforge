<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Hover Effects</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="gallery">
    <div class="image-container">
      <img src="./img/nature.jpg" alt="Nature">
      <div class="overlay">
        <p>Nature</p>
      </div>
    </div>
    <div class="image-container">
      <img src="./img/city.jpg" alt="City">
      <div class="overlay">
        <p>City</p>
      </div>
    </div>
    <div class="image-container">
      <img src="./img/ocean.jpg" alt="Ocean">
      <div class="overlay">
        <p>Ocean</p>
      </div>
    </div>
    <div class="image-container">
      <img src="./img/mountains.jpg" alt="Mountains">
      <div class="overlay">
        <p>Mountains</p>
      </div>
    </div>
    <div class="image-container">
      <img src="./img/forest.jpg" alt="Forest">
      <div class="overlay">
        <p>Forest</p>
      </div>
    </div>
    <div class="image-container">
      <img src="./img/space.jpg" alt="Space">
      <div class="overlay">
        <p>Space</p>
      </div>
    </div>
  </div>
</body>
</html>
